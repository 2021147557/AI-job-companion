<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 취업 동행</title>
    <link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header-spacer"></div>
            <h1 class="header-text">AI 취업 동행 서비스</h1>
        </header>
        <nav class="navigation"></nav>

        <div class="form-box">
            <h2 class="section-title">회원가입</h2>
            <form id="signup-form">
                <div class="form-row">
                    <label for="name" class="field-label">이름</label>
                    <input type="text" id="name" name="name" class="field-input" autofocus required placeholder="이름">
                </div>
                <div class="form-row">
                    <label for="userid" class="field-label">아이디</label>
                    <input type="text" id="userid" name="userid" class="field-input" required placeholder="아이디" autocomplete="username">
                </div>
                <div class="form-row">
                    <label for="password" class="field-label">비밀번호 (6자 이상)</label>
                    <input type="password" id="password" name="password" class="field-input" required placeholder="비밀번호" autocomplete="new-password">
                </div>
                <div class="form-row">
                    <label for="email" class="field-label">이메일</label>
                    <input type="email" id="email" name="email" class="field-input" placeholder="example@domain.com" autocomplete="email">
                </div>
                <div id="err" class="error-msg" style="display:none;"></div>
                <div class="button-row">
                    <button type="submit" class="btn btn-primary">가입하기</button>
                    <a href="/login.html" class="btn btn-secondary">이미 계정이 있어요</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/common.js"></script>
    <script>
        renderNav('/signup.html', null);
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const userid = document.getElementById('userid').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();
            const err = document.getElementById('err');
            err.style.display = 'none';
            try {
                await API.post('/api/auth/signup', { name, userid, password, email });
                location.href = '/portfolio.html';
            } catch (ex) {
                err.textContent = ex.message;
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
